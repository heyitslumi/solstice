<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <meta name="theme-color" content="#0e1420" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Solstice Host control panel. Manage your virtual private servers, snapshots, backups and network allocations."
    />
    <title>Solstice Host</title>
    <script>
      // Applied before first paint so the correct theme renders without a flash.
      ;(() => {
        try {
          const stored = localStorage.getItem('solstice-theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const dark = stored ? stored === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
