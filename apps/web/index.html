<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="theme-color" content="#6c5ce7" />
    <meta
      name="description"
      content="Next-generation cloud infrastructure and VPS management platform."
    />
    <meta property="og:site_name" content="Solstice" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Solstice" />
    <meta property="og:description" content="Next-generation cloud infrastructure and VPS management platform." />
    <meta property="og:image" content="/brand/mark.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solstice" />
    <meta name="twitter:description" content="Next-generation cloud infrastructure and VPS management platform." />
    <meta name="twitter:image" content="/brand/mark.svg" />
    <meta name="robots" content="index, follow" />
    <title>Solstice</title>
    <script>
      // Applied before first paint so the correct theme renders without a flash.
      ;(() => {
        try {
          const stored = localStorage.getItem('solstice-theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const dark = stored ? stored === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
